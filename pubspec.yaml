name: bunyan_marketplace
description: Professional Construction Materials Marketplace for Saudi Arabia
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^14.2.7
  
  # Local Storage & Database
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  
  # HTTP & Networking
  http: ^1.2.2
  dio: ^5.4.3+1
  
  # UI & Animations
  cupertino_icons: ^1.0.2
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Utils
  uuid: ^4.4.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  
  # Security & Encryption
  crypto: ^3.0.3
  encrypt: ^5.0.3
  
  # Chat & Real-time
  socket_io_client: ^2.0.3+1
  
  # Notifications
  flutter_local_notifications: ^17.2.2
  
  # File handling
  file_picker: ^8.0.6
  path_provider: ^2.1.3
  
  # Maps & Location
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  
  # QR Code
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_annotation: ^4.8.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/animations/
    - assets/fonts/
  
